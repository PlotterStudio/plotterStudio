[package]
name = "grbl-plugin"
description = "The GRBL reference device plugin for Plotter Studio, built as a WebAssembly component."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ps-device-sdk.workspace = true
wit-bindgen = "0.57"

# The component bindings generated by wit-bindgen are `unsafe` by nature, so this crate cannot
# inherit the workspace's `forbid(unsafe_code)`; none is written by hand here.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
