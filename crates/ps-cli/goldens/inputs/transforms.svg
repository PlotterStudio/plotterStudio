<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200mm" height="200mm" viewBox="0 0 200 200">
  <defs>
    <rect id="tile" x="0" y="0" width="20" height="10" fill="none" stroke="#FF0000" stroke-width="0.5"/>
  </defs>
  <g transform="translate(20 20) rotate(15)">
    <use xlink:href="#tile"/>
    <g transform="translate(30 0) scale(1.5 2)">
      <use xlink:href="#tile"/>
    </g>
  </g>
  <g transform="translate(100 100) skewX(10)">
    <rect x="0" y="0" width="30" height="30" fill="none" stroke="#0000FF" stroke-width="0.5"/>
  </g>
</svg>
