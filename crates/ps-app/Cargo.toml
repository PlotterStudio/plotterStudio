[package]
name = "ps-app"
description = "Plotter Studio application logic: commands, shortcuts, formatting, localisation and background jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "plotter-studio"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
epaint_default_fonts.workspace = true
fluent-bundle.workspace = true
fluent-syntax.workspace = true
image.workspace = true
indexmap.workspace = true
ps-compiler.workspace = true
fontdb.workspace = true
ps-core.workspace = true
ps-device.workspace = true
ps-gcode.workspace = true
ps-geometry.workspace = true
ps-import.workspace = true
ps-job.workspace = true
ps-library.workspace = true
ps-net.workspace = true
ps-model.workspace = true
ps-render.workspace = true
rayon.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
rfd.workspace = true
sys-locale.workspace = true
# Not used directly: enables the graphics backends eframe's wgpu renderer needs.
wgpu.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
