# cargo-deny: supply-chain checks. Run with `cargo deny check` (install: `cargo install cargo-deny`).
[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities and on unmaintained/yanked crates in the tree.
yanked = "deny"
ignore = [
    # Both are "unmaintained" notices, not vulnerabilities, with no maintained drop-in
    # replacement for the text shaping they provide. Revisit when one appears.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; no vulnerability, no safe upgrade" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained; no vulnerability, no safe upgrade" },
]

[licenses]
# Permissive licences compatible with this MIT-licensed project.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0", # boostvoronoi
    "MIT-0", # borrow-or-share, via wit tooling
    "CC0-1.0", # hexf-parse, via wgpu
    "CDLA-Permissive-2.0", # webpki-roots: the Mozilla certificate list
    "OFL-1.1", # egui default fonts
    "Ubuntu-font-1.0", # egui default fonts
    "LicenseRef-Hershey", # the Hershey fonts, see the clarification below
]
confidence-threshold = 0.9

# vector-text-hershey declares no licence in its manifest; it ships the Hershey fonts with their
# own permissive terms (attribution is reproduced in THIRD-PARTY-LICENSES.md).
[[licenses.clarify]]
crate = "vector-text-hershey"
expression = "LicenseRef-Hershey"
license-files = [{ path = "LICENSE", hash = 0x879bb6fc }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version; that's fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
